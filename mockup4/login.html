<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة إنفينيتي | Infinity - تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#578e7e;--primary-dark:#3c655a;--primary-light:#dcebe5;--gold:#e3af64;--gold-dark:#da9035;--dark:#161618;--bg:#f2f2f7;--bg-light:#f9f9fb;--warm-bg:#fff8f0;--warm-bg2:#fef3e2;--radius:16px;--radius-lg:20px;--shadow:0 4px 24px rgba(0,0,0,.08);--shadow-lg:0 8px 40px rgba(0,0,0,.12)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--dark);direction:rtl;min-height:100vh}a{text-decoration:none;color:inherit}
.logo{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:8px}.logo span:first-child{color:var(--gold-dark)}.logo span:last-child{color:var(--primary);font-family:'Tajawal',sans-serif;font-weight:700}
.login-section{max-width:480px;margin:40px auto;padding:0 20px;position:relative;z-index:1}
.login-card{background:var(--warm-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:48px 40px;text-align:center;border-top:4px solid var(--gold)}
.login-card .icon{width:72px;height:72px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;margin-bottom:20px}
.login-card h1{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.login-card .subtitle{color:#888;font-family:'Tajawal',sans-serif;margin-bottom:32px}
.form-group{margin-bottom:20px;text-align:right}
.form-group label{display:block;font-weight:600;font-size:.9rem;margin-bottom:8px}
.form-group input{width:100%;padding:14px 16px;border:2px solid #eee;border-radius:12px;font-size:1rem;font-family:'Cairo',sans-serif;transition:.3s;background:#fff}
.form-group input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px rgba(227,175,100,.15)}
.form-group .input-icon{position:relative}
.form-group .input-icon i{position:absolute;top:50%;right:16px;transform:translateY(-50%);color:#aaa}
.form-group .input-icon input{padding-right:44px}
.form-options{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:.9rem}
.form-options label{display:flex;align-items:center;gap:6px;cursor:pointer}
.form-options input[type="checkbox"]{accent-color:var(--gold-dark)}
.form-options a{color:var(--gold-dark);font-weight:600}
.btn-warm{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;border:none;padding:16px;border-radius:var(--radius);font-size:1.1rem;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;width:100%;box-shadow:0 4px 16px rgba(227,175,100,.4);transition:.3s}
.btn-warm:hover{transform:translateY(-2px)}
.divider{display:flex;align-items:center;gap:16px;margin:24px 0;color:#aaa;font-size:.85rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#ddd}
.social-login{display:flex;gap:12px;margin-bottom:24px}
.social-btn{flex:1;padding:12px;border:2px solid #eee;border-radius:12px;background:#fff;cursor:pointer;font-size:1.2rem;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Cairo',sans-serif;font-weight:600;font-size:.9rem}
.social-btn:hover{border-color:var(--gold);background:var(--warm-bg2)}
.social-btn.fb{color:#1877f2}.social-btn.gg{color:#ea4335}
.register-link{font-size:.95rem;color:#666}
.register-link a{color:var(--gold-dark);font-weight:700}
/* FLOATING SHAPES */
.shapes-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.shape{position:absolute;bottom:-60px;opacity:0;animation:floatShape linear infinite}
.shape.circle{border-radius:50%}
.shape.square{border-radius:4px}
.shape.diamond{transform:rotate(45deg)}
@keyframes floatShape{
  0%{transform:translateX(0) rotate(0deg) scale(0.6);opacity:0;bottom:-60px}
  10%{opacity:1}
  50%{transform:translateX(60px) rotate(180deg) scale(1)}
  90%{opacity:1}
  100%{transform:translateX(-30px) rotate(360deg) scale(0.6);opacity:0;bottom:110vh}
}
/* FADE IN ON SCROLL */
.fade-in{opacity:0;transform:translateY(25px);transition:opacity 0.7s ease,transform 0.7s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}
@media(max-width:768px){.login-card{padding:32px 24px}}
</style>
</head>
<body>
<div class="shapes-bg">
<div class="shape circle" style="width:15px;height:15px;background:rgba(227,175,100,0.06);left:5%;animation-duration:14s;animation-delay:0s"></div>
<div class="shape square" style="width:20px;height:20px;background:rgba(87,142,126,0.07);left:15%;animation-duration:18s;animation-delay:2s"></div>
<div class="shape diamond" style="width:12px;height:12px;background:rgba(227,175,100,0.08);left:25%;animation-duration:15s;animation-delay:4s"></div>
<div class="shape circle" style="width:25px;height:25px;background:rgba(87,142,126,0.05);left:35%;animation-duration:20s;animation-delay:1s"></div>
<div class="shape square" style="width:10px;height:10px;background:rgba(227,175,100,0.07);left:50%;animation-duration:13s;animation-delay:3s"></div>
<div class="shape diamond" style="width:18px;height:18px;background:rgba(87,142,126,0.06);left:60%;animation-duration:22s;animation-delay:5s"></div>
<div class="shape circle" style="width:30px;height:30px;background:rgba(227,175,100,0.05);left:70%;animation-duration:16s;animation-delay:0.5s"></div>
<div class="shape square" style="width:40px;height:40px;background:rgba(87,142,126,0.06);left:80%;animation-duration:19s;animation-delay:2.5s"></div>
<div class="shape diamond" style="width:14px;height:14px;background:rgba(227,175,100,0.08);left:88%;animation-duration:12s;animation-delay:6s"></div>
<div class="shape circle" style="width:22px;height:22px;background:rgba(87,142,126,0.07);left:95%;animation-duration:17s;animation-delay:3.5s"></div>
</div>

<div style="text-align:center;padding:40px 0 0;position:relative;z-index:1">
<a href="index.html" class="logo" style="display:inline-flex;font-size:1.8rem;justify-content:center"><span>مكتبة إنفينيتي</span><span>| Infinity</span></a>
</div>

<section class="login-section fade-in">
<div class="login-card">
<div class="icon"><i class="fas fa-user"></i></div>
<h1 data-i18n="login">تسجيل الدخول</h1>
<p class="subtitle" data-i18n="login-welcome">مرحباً بعودتك! سجل دخولك للمتابعة</p>
<form onsubmit="event.preventDefault();alert('تم تسجيل الدخول بنجاح!')">
<div class="form-group"><label data-i18n="email">البريد الإلكتروني</label><div class="input-icon"><i class="fas fa-envelope"></i><input type="email" placeholder="example@email.com" required></div></div>
<div class="form-group"><label data-i18n="password">كلمة المرور</label><div class="input-icon"><i class="fas fa-lock"></i><input type="password" placeholder="أدخل كلمة المرور" required></div></div>
<div class="form-options"><label><input type="checkbox"> <span data-i18n="remember-me">تذكرني</span></label><a href="#" data-i18n="forgot-password">نسيت كلمة المرور؟</a></div>
<button type="submit" class="btn-warm" data-i18n="login-btn">تسجيل الدخول</button>
</form>
<div class="divider" data-i18n="or-login-via">أو سجل عن طريق</div>
<div class="social-login">
<button class="social-btn fb"><i class="fab fa-facebook-f"></i> <span data-i18n="facebook">فيسبوك</span></button>
<button class="social-btn gg"><i class="fab fa-google"></i> <span data-i18n="google">جوجل</span></button>
</div>
<p class="register-link"><span data-i18n="no-account">ليس لديك حساب؟</span> <a href="register.html" data-i18n="register-now">سجل الآن</a></p>
</div>
</section>

<div style="text-align:center;margin:24px 0 40px;position:relative;z-index:1"><a href="index.html" style="color:var(--gold-dark);font-weight:700;font-size:1rem"><i class="fas fa-arrow-right" style="margin-left:8px"></i> العودة للرئيسية</a></div>

<script>
document.addEventListener('DOMContentLoaded',function(){
  const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})},{threshold:0.15});
  document.querySelectorAll('.fade-in').forEach(el=>obs.observe(el));
});
</script>
<script src="i18n.js"></script>
</body>
</html>
