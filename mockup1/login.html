<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة إنفينيتي | Infinity - تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#578e7e;--primary-dark:#3c655a;--primary-light:#dcebe5;--accent:#e3af64;--accent-dark:#da9035;--text:#161618;--bg-light:#f2f2f7;--bg-white:#f9f9fb;--shadow:0 2px 12px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.12);--radius:12px;--radius-sm:8px}
body{font-family:'Cairo','Tajawal',sans-serif;color:var(--text);background:var(--bg-light);line-height:1.7;min-height:100vh}
a{text-decoration:none;color:inherit}ul{list-style:none}img{max-width:100%;display:block}
.btn{display:inline-block;border:none;cursor:pointer;border-radius:50px;font-family:'Cairo',sans-serif;font-weight:600;transition:all .3s}
.btn-primary{background:var(--accent);color:#fff;padding:10px 28px;font-size:.95rem}.btn-primary:hover{background:var(--accent-dark);transform:translateY(-2px)}
/* Auth Logo */
.auth-logo{text-align:center;padding:40px 20px 0;position:relative;z-index:1}
.auth-logo a{font-family:'Cairo',sans-serif;font-size:1.6rem;font-weight:800;color:var(--primary-dark);transition:color .3s}
.auth-logo a span{color:var(--accent);font-weight:700}
.auth-logo a:hover{color:var(--primary)}
/* Auth Section */
.auth-section{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 100px);padding:20px 20px 40px;position:relative;z-index:1}
.auth-card{background:#fff;border-radius:var(--radius);padding:48px 40px;box-shadow:var(--shadow-lg);width:100%;max-width:460px}
.auth-card h1{font-size:1.6rem;font-weight:800;color:var(--primary-dark);text-align:center;margin-bottom:8px}
.auth-card .subtitle{text-align:center;color:#888;font-size:.9rem;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px;color:var(--text)}
.form-group input{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:var(--radius-sm);font-family:'Cairo',sans-serif;font-size:.95rem;transition:border-color .3s}
.form-group input:focus{border-color:var(--primary);outline:none}
.form-options{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:.85rem}
.form-options a{color:var(--primary);font-weight:600}
.form-options label{display:flex;align-items:center;gap:6px;cursor:pointer}
.auth-card .btn-primary{width:100%;padding:14px;font-size:1rem;text-align:center}
.divider{display:flex;align-items:center;gap:16px;margin:24px 0;color:#ccc;font-size:.85rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e0e0e0}
.social-login{display:flex;gap:12px}
.social-login button{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .3s}
.social-login button:hover{border-color:var(--primary);background:var(--primary-light)}
.social-login button i{font-size:1.1rem}
.auth-footer{text-align:center;margin-top:24px;font-size:.9rem;color:#888}
.auth-footer a{color:var(--primary);font-weight:700}
.back-home{display:block;text-align:center;margin-top:20px;color:var(--primary);font-weight:600;font-size:.9rem;transition:color .3s}
.back-home:hover{color:var(--primary-dark)}
.back-home i{margin-left:6px}
.whatsapp-float{position:fixed;bottom:24px;left:24px;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem;box-shadow:var(--shadow-lg);z-index:999;transition:transform .3s}.whatsapp-float:hover{transform:scale(1.1)}
/* Floating Bubbles */
.bubbles-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-80px;border-radius:50%;opacity:0;animation:floatBubble linear infinite}
@keyframes floatBubble{0%{transform:translateX(0) scale(0.5);opacity:0;bottom:-80px}10%{opacity:1}90%{opacity:1}100%{transform:translateX(100px) scale(1);opacity:0;bottom:110vh}}
/* Fade-in Animation */
.fade-in{opacity:0;transform:translateY(30px);transition:opacity 0.8s ease,transform 0.8s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}
@media(max-width:768px){.auth-card{padding:32px 24px}}
</style>
</head>
<body>

<div class="bubbles-bg">
  <div class="bubble" style="width:20px;height:20px;left:5%;background:rgba(87,142,126,0.08);animation-duration:12s;animation-delay:0s;"></div>
  <div class="bubble" style="width:40px;height:40px;left:15%;background:rgba(227,175,100,0.06);animation-duration:15s;animation-delay:2s;"></div>
  <div class="bubble" style="width:15px;height:15px;left:25%;background:rgba(87,142,126,0.07);animation-duration:10s;animation-delay:4s;"></div>
  <div class="bubble" style="width:50px;height:50px;left:40%;background:rgba(227,175,100,0.05);animation-duration:18s;animation-delay:1s;"></div>
  <div class="bubble" style="width:25px;height:25px;left:55%;background:rgba(87,142,126,0.08);animation-duration:14s;animation-delay:3s;"></div>
  <div class="bubble" style="width:35px;height:35px;left:70%;background:rgba(227,175,100,0.06);animation-duration:16s;animation-delay:5s;"></div>
  <div class="bubble" style="width:18px;height:18px;left:80%;background:rgba(87,142,126,0.07);animation-duration:11s;animation-delay:2.5s;"></div>
  <div class="bubble" style="width:45px;height:45px;left:90%;background:rgba(227,175,100,0.05);animation-duration:17s;animation-delay:4.5s;"></div>
</div>

<div class="auth-logo">
  <a href="index.html">مكتبة إنفينيتي <span>| Infinity</span></a>
</div>

<section class="auth-section">
  <div class="auth-card">
    <h1 data-i18n="loginTitle">تسجيل الدخول</h1>
    <p class="subtitle" data-i18n="loginSubtitle">أهلاً بك مرة أخرى! سجل دخولك للمتابعة</p>
    <form onsubmit="event.preventDefault()">
      <div class="form-group">
        <label data-i18n="emailOrPhone">البريد الإلكتروني أو رقم الهاتف</label>
        <input type="text" placeholder="example@email.com أو 01012345678">
      </div>
      <div class="form-group">
        <label data-i18n="password">كلمة المرور</label>
        <input type="password" placeholder="أدخل كلمة المرور" data-i18n-placeholder="enterPassword">
      </div>
      <div class="form-options">
        <label><input type="checkbox"> <span data-i18n="rememberMe">تذكرني</span></label>
        <a href="#" data-i18n="forgotPassword">نسيت كلمة المرور؟</a>
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="loginTitle">تسجيل الدخول</button>
    </form>
    <div class="divider"><span data-i18n="or">أو</span></div>
    <div class="social-login">
      <button><i class="fab fa-google" style="color:#DB4437"></i> Google</button>
      <button><i class="fab fa-facebook-f" style="color:#4267B2"></i> Facebook</button>
    </div>
    <p class="auth-footer"><span data-i18n="noAccount">ليس لديك حساب؟</span> <a href="register.html" data-i18n="registerNow">سجل الآن</a></p>
    <a href="index.html" class="back-home"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
  </div>
</section>

<a href="https://wa.me/201012345678" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

<script>
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.auth-card, .auth-logo').forEach(function(el){el.classList.add('fade-in');});
  var fadeObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');fadeObserver.unobserve(e.target);}});},{threshold:0.1});
  document.querySelectorAll('.fade-in').forEach(function(el){fadeObserver.observe(el);});
});
</script>
<script src="lang-toggle.js"></script>
</body>
</html>
